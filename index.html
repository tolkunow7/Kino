<!DOCTYPE html>
<html lang="tk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KinoApp</title>
<style>
:root{--bg:#121a2b;--card:#1c2740;--line:#2b3a5c;--txt:#eef0f6;--dim:#9aa6c2;--red:#b8322a;--gold:#e8b44c}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--txt);font:16px/1.4 system-ui,sans-serif;padding-bottom:40px}
header{display:flex;align-items:center;padding:14px 16px;position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
h1{font-size:22px;color:var(--gold);font-weight:800;cursor:pointer;user-select:none}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 16px}
.tab{padding:8px 16px;border-radius:20px;border:1px solid var(--line);background:none;color:var(--dim);white-space:nowrap;font-size:15px}
.tab.on{background:var(--red);border-color:var(--red);color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:0 16px}
.film{background:var(--card);border-radius:10px;overflow:hidden;border:1px solid var(--line);text-align:left;color:var(--txt);padding:0}
.poster{aspect-ratio:2/3;background:linear-gradient(160deg,#2b3a5c,#121a2b);display:flex;align-items:center;justify-content:center;font-size:40px}
.poster img{width:100%;height:100%;object-fit:cover}
.film b{display:block;padding:8px 10px 2px}
.film small{display:block;padding:0 10px 10px;color:var(--gold)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:flex-end;z-index:10}
.ov.show{display:flex}
.box{background:var(--card);width:100%;max-height:90vh;overflow:auto;border-radius:16px 16px 0 0;padding:20px}
.box h2{margin-bottom:10px}
.box h3{margin:18px 0 6px}
.box p{color:var(--dim);margin:6px 0}
.num{font-size:22px;color:var(--gold);font-weight:800;margin:6px 0 12px}
input,select,textarea{width:100%;padding:12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--txt);font-size:17px;margin:6px 0;font-family:inherit}
.btn{width:100%;padding:13px;border:0;border-radius:8px;background:var(--red);color:#fff;font-size:17px;font-weight:700;margin-top:8px}
.btn.alt{background:none;border:1px solid var(--line);color:var(--dim)}
.btn.sm{width:auto;padding:6px 12px;font-size:14px;margin:4px 0}
.msg{color:var(--gold);margin-top:8px;min-height:20px}
.row{border-top:1px solid var(--line);padding:10px 0}
.x{color:var(--red);margin-left:8px;font-weight:800;padding:4px 8px}
video{width:100%;border-radius:8px;background:#000;-webkit-touch-callout:none}
</style>
</head>
<body>
<header><h1 id="logo">KinoApp</h1></header>
<div class="tabs" id="tabs"></div>
<div class="grid" id="grid"></div>
<div class="ov" id="ov"><div class="box" id="box"></div></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,onAuthStateChanged,signInAnonymously,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,collection,doc,getDoc,getDocs,setDoc,addDoc,updateDoc,deleteDoc,onSnapshot,query,where} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const app=initializeApp({
  apiKey:"AIzaSyCEYyvWp9QX-bSgA_gscZYSzQhcxfK1Y0E",
  authDomain:"kinoapp-9f126.firebaseapp.com",
  projectId:"kinoapp-9f126",
  storageBucket:"kinoapp-9f126.firebasestorage.app",
  messagingSenderId:"1017209401941",
  appId:"1:1017209401941:web:59150b486ffc4ed0749adc"
});
const auth=getAuth(app), db=getFirestore(app);

// ====== SAZLAMALAR ======
const PAY_NUMBER="+99371909840";      // tölegiň gelmeli nomeri
const PRICE=1;                        // manat
const ADMIN_EMAIL="tolkunowmaksat7@gmail.com";
const cats=["Hemmesi","Kino","Serial","Multfilm","Karaoke"];
const icons={Kino:"🎬",Serial:"📺",Multfilm:"🧸",Karaoke:"🎤"};

let cat="Hemmesi", films=[], uid=null, isAdmin=false, reqs={}, unsub=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const film=id=>films.find(f=>f.id===id);
const msg=t=>{const m=$("msg"); if(m) m.textContent=t;};
const show=h=>{$("box").innerHTML=h; $("ov").classList.add("show");};
const closeBox=()=>{ if(unsub){unsub();unsub=null;} $("ov").classList.remove("show"); $("box").innerHTML=""; };

// ====== GIRIŞ (her telefona gizlin ID) ======
onAuthStateChanged(auth,u=>{
  if(!u){ signInAnonymously(auth).catch(e=>alert("Giriş ýalňyşlygy: "+e.code)); return; }
  uid=u.uid;
  isAdmin=!u.isAnonymous && u.email===ADMIN_EMAIL;
});

// ====== FILMLER ======
onSnapshot(collection(db,"films"),s=>{
  films=s.docs.map(d=>({id:d.id,...d.data()}));
  drawGrid();
},e=>alert("Filmler ýüklenmedi: "+e.code));

function drawTabs(){
  $("tabs").innerHTML=cats.map(c=>`<button class="tab${c===cat?" on":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}
function setCat(c){cat=c; drawTabs(); drawGrid();}
function drawGrid(){
  const l=films.filter(f=>cat==="Hemmesi"||f.c===cat);
  $("grid").innerHTML=l.length?l.map(f=>
    `<button class="film" onclick="openFilm('${f.id}')"><div class="poster">${f.p?`<img src="${esc(f.p)}" alt="">`:f.e}</div><b>${esc(f.t)}</b><small>${PRICE} manat</small></button>`
  ).join(""):'<p style="color:var(--dim)">Bu bölümde entek film ýok.</p>';
}

// ====== MÜŞDERI: TÖLEG WE KOD ======
function openFilm(id){
  const f=film(id);
  show(`<h2>${esc(f.t)}</h2>
  <p>1. Şu nomere ${PRICE} manat geçir:</p><div class="num">${PAY_NUMBER}</div>
  <p>2. Öz nomeriňi ýaz:</p><input id="ph" type="tel" placeholder="+993 6X XXXXXX">
  <button class="btn" onclick="sendReq('${id}')">Tölegi tassykla</button>
  <div class="msg" id="msg"></div>
  <p>3. Tölegiň barlanandan soň kod şu ýerde özi çykar:</p><input id="cd" type="tel" maxlength="6" placeholder="Kod (6 san)">
  <div class="msg" id="cmsg"></div>
  <button class="btn" onclick="useCode('${id}')">Filmi aç</button>
  <div id="cms"></div>
  <button class="btn alt" onclick="closeBox()">Ýap</button>`);
  drawCm(id);
  watchCode(id);
}
function watchCode(id){
  if(unsub){unsub(); unsub=null;}
  if(!uid) return;
  unsub=onSnapshot(query(collection(db,"requests"),where("uid","==",uid),where("film","==",id)),s=>{
    const c=$("cd"), m=$("cmsg"); if(!c||!m) return;
    const r=s.docs.map(d=>d.data()).filter(x=>x.code).sort((a,b)=>b.at-a.at)[0];
    if(r){ c.value=r.code; m.textContent="Tassyklandy! Kodyňyz: "+r.code+". Indi «Filmi aç» düwmesini bas."; }
    else if(s.size){ m.textContent="Haýyşyň barlanýar. Kod şu ýere özi geler."; }
  },()=>{});
}
async function sendReq(id){
  const ph=$("ph").value.trim();
  if(ph.length<8) return msg("Nomeriňi dogry ýaz.");
  try{
    await addDoc(collection(db,"requests"),{film:id,phone:ph,uid,at:Date.now()});
    msg("Haýyş iberildi. Töleg barlanandan soň kod aşakda özi çykar.");
  }catch(e){ msg("Ýalňyşlyk: "+e.code); }
}
async function tryPlay(id){
  try{
    const s=await getDoc(doc(db,"secrets",id));
    if(s.exists() && s.data().u){ play(id,s.data().u); return true; }
  }catch(e){}
  return false;
}
function play(id,u){
  const f=film(id);
  show(`<h2>${esc(f.t)}</h2><video controls autoplay playsinline controlsList="nodownload noremoteplayback" disablePictureInPicture oncontextmenu="return false" src="${esc(u)}"></video><div id="cms"></div><button class="btn alt" onclick="closeBox()">Ýap</button>`);
  drawCm(id);
}
async function useCode(id){
  if(await tryPlay(id)) return;       // öň tölän bolsa, kod gerek däl
  const cd=$("cd").value.trim();
  if(!cd) return msg("Kod entek gelmedi ýa-da ýazylmady.");
  try{ await setDoc(doc(db,"redeemed",uid+"_"+id),{film:id,code:cd}); }
  catch(e){ return msg("Kod ýalňyş ýa-da başga telefona baglanan."); }
  if(!(await tryPlay(id))) msg("Wideo linki entek goýulmadyk.");
}

// ====== TESWIRLER ======
async function drawCm(id){
  const box=$("cms"); if(!box) return;
  let l=[];
  try{
    const s=await getDocs(query(collection(db,"comments"),where("f","==",id)));
    l=s.docs.map(d=>({i:d.id,...d.data()})).sort((a,b)=>a.at-b.at);
  }catch(e){}
  box.innerHTML=`<h3>Teswirler (${l.length})</h3>`+
    (l.length?l.map(c=>`<div class="row"><b>${esc(c.n)}</b>${isAdmin?`<span class="x" onclick="delCm('${c.i}','${id}')">✕</span>`:""}<p>${esc(c.t)}</p></div>`).join(""):"<p>Entek teswir ýok. Birinji bol!</p>")+
    `<input id="cn" maxlength="30" placeholder="Adyň"><textarea id="ct" rows="3" maxlength="300" placeholder="Teswiriňi ýaz"></textarea><button class="btn" onclick="addCm('${id}')">Teswir ugrat</button>`;
}
async function addCm(id){
  const n=$("cn").value.trim(), t=$("ct").value.trim();
  if(!n||!t) return;
  try{ await addDoc(collection(db,"comments"),{f:id,n,t,at:Date.now()}); }catch(e){}
  drawCm(id);
}
async function delCm(cid,id){
  try{ await deleteDoc(doc(db,"comments",cid)); }catch(e){}
  drawCm(id);
}

// ====== ADMIN (logony 5 gezek bas) ======
let taps=0;
$("logo").onclick=()=>{
  taps++; setTimeout(()=>taps=0,2500);
  if(taps>=5){ taps=0; isAdmin?drawAdmin():loginForm(); }
};
function loginForm(){
  show(`<h2>Admin</h2><input id="em" type="email" value="${ADMIN_EMAIL}"><input id="pw" type="password" placeholder="Parol">
  <button class="btn" onclick="login()">Gir</button><div class="msg" id="msg"></div>
  <button class="btn alt" onclick="closeBox()">Ýap</button>`);
}
async function login(){
  try{ await signInWithEmailAndPassword(auth,$("em").value.trim(),$("pw").value); }
  catch(e){ return msg("Giriş ýalňyş: "+e.code); }
  isAdmin=auth.currentUser && auth.currentUser.email===ADMIN_EMAIL;
  if(isAdmin) drawAdmin(); else msg("Bu akkaunt admin däl.");
}
async function doLogout(){ await signOut(auth); isAdmin=false; closeBox(); }

async function drawAdmin(){
  show("<p>Ýüklenýär...</p>");
  reqs={};
  try{ const s=await getDocs(collection(db,"requests")); s.docs.forEach(d=>reqs[d.id]=d.data()); }
  catch(e){ return show(`<p>Ýalňyşlyk: ${e.code}</p><button class="btn alt" onclick="closeBox()">Ýap</button>`); }
  const ids=Object.keys(reqs).sort((a,b)=>reqs[b].at-reqs[a].at);
  const list=ids.length?ids.map(i=>{
    const r=reqs[i], f=film(r.film)||{t:"(pozulan film)"};
    return `<div class="row"><b>${esc(f.t)}</b><p>${esc(r.phone)}</p>`+
      (r.code?`Kod: <b>${r.code}</b> <button class="btn sm" onclick="issue('${i}')">Täze kod</button>`
             :`<button class="btn sm" onclick="issue('${i}')">Tassykla</button>`)+`</div>`;
  }).join(""):"<p>Haýyş ýok.</p>";
  const fl=films.map(f=>`<div class="row">${esc(f.t)} <span class="x" onclick="delFilm('${f.id}')">Poz</span></div>`).join("");
  show(`<h2>Admin</h2><button class="btn" onclick="addForm()">+ Täze film goş</button>
  <h3>Haýyşlar</h3>${list}<h3>Filmler</h3>${fl}
  <button class="btn alt" onclick="doLogout()">Admin-den çyk</button>
  <button class="btn alt" onclick="closeBox()">Ýap</button>`);
}
async function issue(rid){
  const r=reqs[rid];
  const code=String(Math.floor(100000+Math.random()*900000));
  try{
    if(r.code){
      await deleteDoc(doc(db,"codes",r.film+"_"+r.code));
      await deleteDoc(doc(db,"redeemed",r.uid+"_"+r.film));
    }
    await setDoc(doc(db,"codes",r.film+"_"+code),{film:r.film,uid:r.uid,code});
    await updateDoc(doc(db,"requests",rid),{status:"ok",code});
  }catch(e){ alert("Ýalňyşlyk: "+e.code); }
  drawAdmin();
}
function addForm(){
  const o=cats.slice(1).map(c=>`<option>${c}</option>`).join("");
  show(`<h2>Täze film goş</h2><input id="nt" placeholder="Filmiň ady"><select id="nc">${o}</select>
  <input id="nu" placeholder="Wideo linki (https://...)"><input id="np" placeholder="Surat linki (islege görä)">
  <button class="btn" onclick="addFilm()">Goş</button><div class="msg" id="msg"></div>
  <button class="btn alt" onclick="drawAdmin()">Yza</button>`);
}
async function addFilm(){
  const t=$("nt").value.trim(); if(!t) return msg("Filmiň adyny ýaz.");
  const c=$("nc").value;
  try{
    const r=await addDoc(collection(db,"films"),{t,c,e:icons[c],p:$("np").value.trim()});
    await setDoc(doc(db,"secrets",r.id),{u:$("nu").value.trim()});
    drawAdmin();
  }catch(e){ msg("Ýalňyşlyk: "+e.code); }
}
async function delFilm(id){
  try{ await deleteDoc(doc(db,"films",id)); await deleteDoc(doc(db,"secrets",id)); }catch(e){}
  drawAdmin();
}

Object.assign(window,{setCat,openFilm,closeBox,sendReq,useCode,addCm,delCm,loginForm,login,doLogout,drawAdmin,issue,addForm,addFilm,delFilm});
drawTabs(); drawGrid();
</script>
</body>
  </html>
